<ion-content class="ion-padding">
  <form [formGroup]="form" class="bdd-flex bdd-flex-col bdd-gap-2">
    <ion-input
      formControlName="firstName"
      type="text"
      fill="outline"
      label="First name"
      labelPlacement="floating"
      placeholder=""
      required="true"
    />

    <ion-input
      formControlName="lastName"
      type="text"
      fill="outline"
      label="Last name"
      labelPlacement="floating"
      placeholder=""
      required="true"
    />

    <ion-input
      formControlName="email"
      type="email"
      fill="outline"
      label="Email"
      labelPlacement="floating"
      placeholder="name@example.com"
      required="true"
    />

    <ion-input
      formControlName="password"
      type="password"
      fill="outline"
      label="Password"
      labelPlacement="floating"
      placeholder="Enter password"
      required="true"
    >
      <ion-input-password-toggle slot="end" />
    </ion-input>

    <ion-input
      formControlName="repeatPassword"
      type="password"
      fill="outline"
      label="Repeat password"
      labelPlacement="floating"
      placeholder="Repeat password"
      required="true"
    >
      <ion-input-password-toggle slot="end" />
    </ion-input>

    <ion-button [disabled]="form.invalid || loading" (click)="register()">
      Register
    </ion-button>

    <ion-button fill="clear" [routerLink]="['/login']">
      Already have an account? Login
    </ion-button>
  </form>
</ion-content>
