<ion-content [fullscreen]="true">
  <div class="auth-page">
    <header class="auth-header">
      <button class="auth-back" type="button" aria-label="Go back" (click)="goBack()">
        <ion-icon name="chevron-back-outline" aria-hidden="true"></ion-icon>
      </button>
    </header>

    <main class="auth-content">
      <div class="auth-brand">
        <!-- Decorative because the wordmark below already contains the brand name -->
        <img class="auth-logo" src="/assets/images/logo.png" alt="" />

        <p class="auth-wordmark">Simple<span>Share</span></p>
      </div>

      <section class="auth-heading">
        <h1 class="auth-title">Welcome back</h1>

        <p class="auth-subtitle">Log in to your account.</p>
      </section>

      <form class="auth-form" [formGroup]="form" (ngSubmit)="login()">
        <div class="auth-field">
          <ion-icon class="auth-field__icon" name="mail-outline" aria-hidden="true"></ion-icon>

          <ion-input
            class="auth-field__input"
            type="email"
            inputmode="email"
            autocomplete="email"
            enterkeyhint="next"
            placeholder="Email"
            aria-label="Email"
            formControlName="email"
          />
        </div>

        <div class="auth-field">
          <ion-icon
            class="auth-field__icon"
            name="lock-closed-outline"
            aria-hidden="true"
          ></ion-icon>

          <ion-input
            class="auth-field__input"
            [type]="passwordVisible() ? 'text' : 'password'"
            autocomplete="current-password"
            enterkeyhint="go"
            placeholder="Password"
            aria-label="Password"
            formControlName="password"
          />

          <button
            class="auth-field__toggle"
            type="button"
            [attr.aria-label]="passwordVisible() ? 'Hide password' : 'Show password'"
            [attr.aria-pressed]="passwordVisible()"
            (click)="togglePassword()"
          >
            <ion-icon
              [name]="passwordVisible() ? 'eye-off-outline' : 'eye-outline'"
              aria-hidden="true"
            ></ion-icon>
          </button>
        </div>

        <button class="auth-forgot" type="button" (click)="forgotPassword()">
          Forgot password?
        </button>

        <button
          class="auth-submit"
          type="submit"
          [disabled]="loading()"
          [attr.aria-busy]="loading()"
        >
          @if (loading()) {
            <ion-spinner name="crescent" />
          } @else {
            Log in
          }
        </button>
      </form>

      <div class="auth-divider">
        <span class="auth-divider__line"></span>

        <span class="auth-divider__label">or</span>

        <span class="auth-divider__line"></span>
      </div>

      <app-google-sign-in-button
        theme="light"
        [loading]="googleLoading()"
        (pressed)="loginWithGoogle()"
      />

      <p class="auth-switch">
        Don't have an account?

        <button class="auth-switch__link" type="button" (click)="goToRegister()">
          Create account
        </button>
      </p>
    </main>
  </div>
</ion-content>
