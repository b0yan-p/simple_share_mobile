<ion-grid>
  @if (group$ | async; as group) {
  <!-- Debt overview card -->
  <!-- <div class="surface-card-title">Your balance</div> -->
  <small class="card-title">Your share</small>
  <ion-row class="surface-card balance-overview" style="position: relative">
    <div class="bdd-flex bdd-jc-space-between bdd-ai-center bdd-gap-1">
      @let net = group.myDebtSummary.net;

      <div class="amount" [ngClass]="{ 'c-success': net >= 0, 'c-error': net < 0 }">
        @if (net > 0) {
        <span class="plus-sign">+</span>
        }
        <span [ngClass]="{ 'c-success': net >= 0, 'c-error': net < 0 }"> {{ net }} </span>
        <span
          class="font-18 font-w-400"
          [ngClass]="{ 'c-success': net >= 0, 'c-error': net < 0 }"
        >
          BAM
        </span>
      </div>

      @if (net >= 0) {
      <app-chip title="You get" severity="success" />
      } @else if (net < 0) {
      <app-chip title="You are owe" severity="error" />
      } @else {
      <app-chip title="Settled up" severity="success" />
      }
    </div>

    <div
      class="user-net-status bdd-flex bdd-gap-1 bdd-ai-cenetr bdd-jc-space-between bdd-ai-center"
      [ngClass]="{
          'user-net-status--positive': net > 0,
          'user-net-status--negative': net < 0,
        }"
    >
      <!-- I Get -->
      <div class="bdd-flex bdd-gap-1 bdd-ai-center">
        <span class="balance-sub-card balance-sub-card--positive" aria-hidden="true">
          <ion-icon name="arrow-down-outline" />
        </span>
        <div class="bdd-flex bdd-flex-col">
          <small>You paid</small>
          <div class="c-success">
            <span class="font-18 font-w-500">
              {{ group.myDebtSummary.paidTotal }}
            </span>
            <span class="font-14">BAM</span>
          </div>
        </div>
      </div>

      <!-- Divider -->
      <div class="divider"></div>

      <!-- I Owe -->
      <div class="bdd-flex bdd-gap-1 bdd-ai-center">
        <span class="balance-sub-card balance-sub-card--negative" aria-hidden="true">
          <ion-icon name="arrow-up-outline" />
        </span>
        <div class="bdd-flex bdd-flex-col">
          <small>You owe</small>
          <div class="c-error">
            <span class="font-18 font-w-500">
              {{ group.myDebtSummary.owedTotal }}
            </span>
            <span class="font-14">BAM</span>
          </div>
        </div>
      </div>
    </div>
  </ion-row>

  <!-- TODO show this option on show more -->
  <!-- <ion-row>
      <app-group-balance-overview
        [data]="group.myDebtSummary"
        [groupId]="group.id"
        [currentMemberId]="group.currentMemberId"
        (settled)="refresh()"
      />
    </ion-row> -->
  }
</ion-grid>
