<ion-header class="ion-no-border">
  <ion-toolbar>
    <ion-title>Groups</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-paddinga">
  @if (!network.isOnline()) {
    <app-offline-warning />
  }
  @if (facade.store.items().length > 0) {
    <ion-list [inset]="true">
      @for (group of facade.store.items(); track group.id) {
        <app-list-item
          [navigatePath]="['groups', group.id, 'details']"
          [title]="group.name"
          [description]="group.netBalanceMessage"
          [descriptionColor]="
            group.netBalance > 0 ? 'success' : group.netBalance < 0 ? 'error' : 'default'
          "
          (onUpdate)="router.navigate(['groups', group.id])"
          (onDelete)="onDelete(group.id)"
        />
      }
    </ion-list>
  } @else if (offlineAndEmpty()) {
    <app-empty-state
      icon="cloud-offline-outline"
      title="You're offline"
      subtitle="No saved groups on this device yet. Reconnect to load them."
    />
  } @else if (!loading()) {
    <app-empty-state
      icon="people-outline"
      title="No groups yet"
      subtitle="Create your first group to start sharing expenses."
      actionLabel="Create group"
      (action)="router.navigate(['groups', 'new'])"
    />
  }

  <ion-infinite-scroll [appPaginate]="paginator">
    <ion-infinite-scroll-content />
  </ion-infinite-scroll>

  @if (network.isOnline()) {
    <ion-fab slot="fixed" vertical="bottom" horizontal="end" [routerLink]="['new']">
      <ion-fab-button>
        <ion-icon name="add" />
      </ion-fab-button>
    </ion-fab>
  }
</ion-content>
