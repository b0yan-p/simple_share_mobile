<div class="surface-card">
  <!-- avatar & name -->
  <div class="bdd-flex bdd-gap-1 bdd-ai-center bdd-pb-2 border-bottom">
    <app-avatar [name]="group().name" [src]="null" [round]="false" [size]="48" />
    <div class="min-width">
      <h4 class="text-one-line">
        {{ group().name }}
      </h4>
      <small class="c-text">
        {{ members()?.length }} member{{
          !!members()?.length && members()!.length > 1 ? 's' : ''
        }}
      </small>
    </div>
  </div>

  <!-- members -->
  <div class="bdd-flex bdd-ai-center bdd-jc-space-between bdd-gap-1">
    <div>
      @for (member of reducedMembers(); track member.memberId) {
        <app-avatar
          [name]="member.displayName"
          [src]="null"
          [colorKey]="member.memberId"
          [size]="36"
          [showBorders]="true"
          [ngClass]="{ 'avatar-negative-margin': !$first }"
        />
      }
    </div>
    <ion-button fill="outline" class="btn-sm" size="small">Add members</ion-button>
  </div>
</div>
