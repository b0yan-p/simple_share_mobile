<img class="cover" [src]="coverImageUrl()" alt="" />
<div class="group-card">
  <strong>{{ group().name }}</strong>
  <span>Trip group</span>
  <div class="members-row">
    <button
      type="button"
      class="member-stack ion-activatable"
      aria-label="View all members"
      (click)="viewMembers.emit()"
    >
      <ion-ripple-effect class="custom-ripple" />
      <div>
        @for (member of reducedMembers(); track member.memberId) {
          <app-avatar
            [name]="member.displayName"
            [src]="null"
            [colorKey]="member.memberId"
            [size]="36"
            [showBorders]="true"
            [ngClass]="{ 'avatar-negative-margin': !$first }"
          />
        }
        @if (hiddenCount() > 0) {
          <span class="member-stack__more avatar-negative-margin">+{{ hiddenCount() }}</span>
        }
        <small class="c-text bdd-ml-1">members</small>
      </div>

      <div class="bdd-flex bdd-ai-center bdd-gap-1">
        <ion-icon class="members-chevron" name="chevron-forward-outline" />
      </div>
    </button>
  </div>
</div>
