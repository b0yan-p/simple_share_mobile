<div class="bdd-flex bdd-jc-space-between bdd-ai-center">
  <h5>Recent groups</h5>
  <ion-button fill="clear" (click)="navigateToGroups()">View all</ion-button>
</div>

<div class="list-container">
  @if (facade.recentStore.items().length > 0) {
    <ion-list>
      @for (group of facade.recentStore.items(); track group.id) {
        <app-list-item
          [title]="group.name"
          [showChevron]="true"
          [id]="group.id"
          [description]="group.netBalanceMessage"
          [descriptionColor]="
            group.netBalance === 0 ? 'default' : group.netBalance < 0 ? 'error' : 'success'
          "
          (click)="navigateToGroupDetails(group.id)"
        />
      }
    </ion-list>
  } @else if (facade.recentStore.status() === 'error') {
    <app-empty-state
      icon="alert-circle-outline"
      title="Could not load recent groups"
      [subtitle]="facade.recentStore.error() ?? ''"
      actionLabel="Try again"
      (action)="facade.loadRecentGroups()"
    />
  } @else if (loading()) {
    <div class="ion-text-center ion-padding" role="status"><ion-spinner name="crescent" /></div>
  } @else if (!network.isOnline()) {
    <app-empty-state
      icon="cloud-offline-outline"
      title="You're offline"
      subtitle="No saved groups on this device yet. Reconnect to load them."
    />
  } @else {
    <app-empty-state
      icon="people-outline"
      title="No groups yet"
      subtitle="Create your first group to start sharing expenses."
      actionLabel="Create group"
      (action)="router.navigate(['groups', 'new'])"
    />
  }
</div>
