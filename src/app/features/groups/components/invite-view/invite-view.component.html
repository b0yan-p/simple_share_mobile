@if (mode === 'link') {
  <p class="modal-subtitle c-text">Share this link to invite people into your group</p>

  <div class="link-box">{{ inviteLink }}</div>

  <div class="invite-actions">
    <ion-button color="primary" (click)="copyLink()">
      <ion-icon name="copy-outline" slot="start" />
      Copy link
    </ion-button>
    <ion-button fill="outline" (click)="shareLink()">
      <ion-icon name="share-social-outline" slot="start" />
      Share link
    </ion-button>
  </div>

  <div class="warning-callout">
    <ion-icon name="alert-circle-outline" />
    <span>Anyone with this link can join your group.</span>
  </div>
