<span class="field-label">Group type</span>
<button
  type="button"
  class="type-row type-trigger"
  [attr.aria-label]="'Group type: ' + selected().title"
  aria-haspopup="dialog"
  [attr.aria-expanded]="opened()"
  (click)="opened.set(true)"
>
  <ion-icon class="type-icon" [name]="selected().icon" aria-hidden="true" />
  <span class="type-copy">
    <span class="type-title">{{ selected().title }}</span>
    <span class="type-description">{{ selected().description }}</span>
  </span>
  <ion-icon class="chevron" name="chevron-down-outline" aria-hidden="true" />
</button>

<ion-modal
  class="modal-sheet group-type-modal"
  [isOpen]="opened()"
  [breakpoints]="breakpoints"
  [initialBreakpoint]="1"
  aria-label="Choose group type"
  (didDismiss)="opened.set(false)"
>
  <ng-template>
    <ion-header class="ion-no-border">
      <ion-toolbar>
        <ion-title>Choose group type</ion-title>
        <ion-buttons slot="end">
          <ion-button
            fill="clear"
            aria-label="Close group type selection"
            (click)="opened.set(false)"
          >
            <ion-icon
              slot="icon-only"
              class="close-icon"
              name="close-outline"
              aria-hidden="true"
            />
          </ion-button>
        </ion-buttons>
      </ion-toolbar>
      <p class="sheet-subtitle">What is this group for?</p>
    </ion-header>
    <ion-content>
      <div class="type-options" role="group" aria-label="Group types">
        @for (option of options; track option.type) {
          <button
            type="button"
            class="type-row type-option"
            [class.is-selected]="option.type === value()"
            [attr.aria-pressed]="option.type === value()"
            (click)="select(option.type)"
          >
            <ion-icon class="type-icon" [name]="option.icon" aria-hidden="true" />
            <span class="type-copy">
              <span class="type-title">{{ option.title }}</span>
              <span class="type-description">{{ option.description }}</span>
            </span>
            <span class="selection-indicator" aria-hidden="true">
              @if (option.type === value()) {
                <ion-icon name="checkmark-outline" />
              }
            </span>
          </button>
        }
      </div>
    </ion-content>
  </ng-template>
</ion-modal>
