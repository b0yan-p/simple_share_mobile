<ion-header>
  <ion-toolbar>
    <ion-title>Friends</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-refresher slot="fixed" [appRefresh]="onRefresh">
    <ion-refresher-content />
  </ion-refresher>

  @if (!network.isOnline()) {
    <app-offline-empty-state />
  }
  @if (service.loading()) {
    <div class="loading-state">
      <ion-spinner name="crescent" />
    </div>
  } @else if (service.items().length === 0 && network.isOnline()) {
    <app-empty-state
      icon="people-outline"
      title="No friends yet"
      subtitle="Friends are added automatically when you share a group with someone."
    />
  } @else {
    <ion-list [inset]="true">
      @for (connection of service.items(); track connection.id) {
        <app-list-item [title]="connection.displayName" [disableSwipeActions]="true" />
      }
    </ion-list>
  }
</ion-content>
