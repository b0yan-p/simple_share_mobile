<ion-modal
  class="modal-sheet profile-modal"
  [isOpen]="editOpen()"
  [breakpoints]="breakpoints"
  [initialBreakpoint]="1"
  aria-label="Edit Profile"
  [canDismiss]="canDismiss"
  (didDismiss)="dismissProfile()"
>
  <ng-template>
    <ion-header class="ion-no-border">
      <ion-toolbar>
        <ion-title>Edit Profile</ion-title>
        <ion-buttons slot="end">
          <ion-button
            fill="clear"
            aria-label="Close"
            [disabled]="state() === 'saving'"
            (click)="dismissProfile()"
          >
            <ion-icon
              name="close-outline"
              slot="icon-only"
              class="close-icon"
              aria-hidden="true"
            />
          </ion-button>
        </ion-buttons>
      </ion-toolbar>
    </ion-header>
    <ion-content>
      @if (state() === 'loading') {
        <p class="ion-padding" role="status">Loading profile...</p>
      } @else if (state() === 'loadError') {
        <div class="ion-padding">
          <p role="alert">Could not load your profile.</p>
          <ion-button (click)="loadProfile()">Try again</ion-button>
        </div>
      } @else {
        <form
          class="profile-form"
          [formGroup]="form"
          (ngSubmit)="saveProfile()"
          appAdvanceInput
        >
          <div class="profile-field">
            <label class="field-label" for="profile-first-name">First name</label>
            <div class="auth-field">
              <ion-input
                class="auth-field__input"
                placeholder="First name"
                id="profile-first-name"
                type="text"
                [readonly]="state() === 'saving'"
                enterkeyhint="next"
                formControlName="firstName"
                aria-label="First name"
                autocomplete="given-name"
                autocapitalize="words"
              />
            </div>
          </div>
          <div class="profile-field">
            <label class="field-label" for="profile-last-name">Last name</label>
            <div class="auth-field">
              <ion-input
                class="auth-field__input"
                placeholder="Last name"
                id="profile-last-name"
                type="text"
                [readonly]="state() === 'saving'"
                enterkeyhint="next"
                formControlName="lastName"
                aria-label="Last name"
                autocomplete="family-name"
                autocapitalize="words"
              />
            </div>
          </div>
          <div class="profile-field">
            <label class="field-label" for="profile-display-name">Display name</label>
            <div class="auth-field">
              <ion-input
                class="auth-field__input"
                placeholder="Display name"
                id="profile-display-name"
                type="text"
                [readonly]="state() === 'saving'"
                enterkeyhint="done"
                formControlName="displayName"
                aria-label="Display name"
                autocomplete="nickname"
              />
            </div>
          </div>
          @if (error()) {
            <p class="auth-error" role="alert">{{ error() }}</p>
          }
          <div class="sheet-actions">
            <ion-button
              type="submit"
              [disabled]="state() === 'saving'"
              expand="block"
              color="primary"
              class="confirm-btn"
            >
              Save
            </ion-button>
            <ion-button
              type="button"
              expand="block"
              fill="clear"
              class="cancel-btn"
              [disabled]="state() === 'saving'"
              (click)="dismissProfile()"
            >
              Cancel
            </ion-button>
          </div>
        </form>
      }
    </ion-content>
  </ng-template>
</ion-modal>
