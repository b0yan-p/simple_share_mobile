<ion-modal
  class="modal-sheet profile-modal"
  [isOpen]="passwordOpen()"
  [breakpoints]="breakpoints"
  [initialBreakpoint]="1"
  aria-label="Change password"
  [canDismiss]="canDismissPassword"
  (didDismiss)="dismissPassword()"
>
  <ng-template>
    <ion-header class="ion-no-border">
      <ion-toolbar>
        <ion-title>Change password</ion-title>
        <ion-buttons slot="end">
          <ion-button
            fill="clear"
            aria-label="Close"
            [disabled]="passwordSaving()"
            (click)="dismissPassword()"
          >
            <ion-icon
              name="close-outline"
              slot="icon-only"
              class="close-icon"
              aria-hidden="true"
            />
          </ion-button>
        </ion-buttons>
      </ion-toolbar>
    </ion-header>
    <ion-content>
      <form
        class="profile-form"
        [formGroup]="passwordForm"
        (ngSubmit)="changePassword()"
        appAdvanceInput
      >
        @for (field of passwordFields; track field.name; let last = $last) {
          @let visible = visiblePasswords()[field.name] === true;
          @let error = fieldError(field.name);
          <div class="auth-field" [class.is-invalid]="error">
            <ion-input
              class="auth-field__input"
              [type]="visible ? 'text' : 'password'"
              [autocomplete]="
                field.name === 'currentPassword' ? 'current-password' : 'new-password'
              "
              [enterkeyhint]="last ? 'go' : 'next'"
              [placeholder]="field.label"
              [attr.aria-label]="field.label"
              [formControlName]="field.name"
              [readonly]="passwordSaving()"
            />
            <button
              type="button"
              class="auth-field__toggle"
              [attr.aria-label]="(visible ? 'Hide ' : 'Show ') + field.label.toLowerCase()"
              [attr.aria-pressed]="visible"
              (click)="togglePassword(field.name)"
            >
              <ion-icon
                [name]="visible ? 'eye-off-outline' : 'eye-outline'"
                aria-hidden="true"
              />
            </button>
          </div>
          @if (error) {
            <p class="auth-error" role="alert">{{ error }}</p>
          }
        }
        @if (passwordError()) {
          <p role="alert">{{ passwordError() }}</p>
        }
        <div class="sheet-actions">
          <ion-button
            type="submit"
            expand="block"
            class="confirm-btn"
            [disabled]="passwordSaving()"
            >Change password</ion-button
          >
          <ion-button
            type="button"
            expand="block"
            fill="clear"
            class="cancel-btn"
            [disabled]="passwordSaving()"
            (click)="dismissPassword()"
            >Cancel</ion-button
          >
        </div>
      </form>
    </ion-content>
  </ng-template>
</ion-modal>
