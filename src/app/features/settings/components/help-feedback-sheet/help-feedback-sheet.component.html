<ion-modal
  class="modal-sheet help-feedback-modal"
  [isOpen]="isOpen()"
  [breakpoints]="[0, 1]"
  [initialBreakpoint]="1"
  [handle]="true"
  aria-label="Help & feedback"
  (didDismiss)="close()"
>
  <ng-template>
    <ion-header class="ion-no-border">
      <ion-toolbar>
        <ion-title>Help & feedback</ion-title>
        <ion-buttons slot="end">
          <ion-button fill="clear" aria-label="Close" (click)="close()">
            <ion-icon name="close-outline" slot="icon-only" />
          </ion-button>
        </ion-buttons>
      </ion-toolbar>
    </ion-header>

    <ion-content>
      <ion-list class="feedback-options">
        <ion-item [button]="true" [detail]="false" lines="inset" (click)="composeEmail('bug')">
          <ion-icon slot="start" name="bug-outline" aria-hidden="true" />
          <ion-label>
            <h3>Report a problem</h3>
            <p>Something isn't working?</p>
          </ion-label>
          <ion-icon slot="end" name="chevron-forward-outline" aria-hidden="true" />
        </ion-item>

        <ion-item
          [button]="true"
          [detail]="false"
          lines="inset"
          (click)="composeEmail('feature')"
        >
          <ion-icon slot="start" name="bulb-outline" aria-hidden="true" />
          <ion-label>
            <h3>Suggest a feature</h3>
            <p>Help us improve ShareOrb</p>
          </ion-label>
          <ion-icon slot="end" name="chevron-forward-outline" aria-hidden="true" />
        </ion-item>

        <ion-item
          [button]="true"
          [detail]="false"
          lines="none"
          (click)="composeEmail('support')"
        >
          <ion-icon slot="start" name="chatbubble-ellipses-outline" aria-hidden="true" />
          <ion-label>
            <h3>Contact support</h3>
            <p>Questions or account issues</p>
          </ion-label>
          <ion-icon slot="end" name="chevron-forward-outline" aria-hidden="true" />
        </ion-item>
      </ion-list>
    </ion-content>
  </ng-template>
</ion-modal>
