<ion-header class="ion-no-border">
  <ion-toolbar>
    <ion-title class="small">{{ firstName() ? 'Hi, ' + firstName() : 'Hi' }}</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <ion-refresher slot="fixed" [appRefresh]="onRefresh">
    <ion-refresher-content />
  </ion-refresher>

  <!-- Welcome -->
  <section class="home-greetings">
    <div class="bdd-flex bdd-ai-center bdd-jc-space-between">
      <h1>Good to see you!</h1>
      @if (!networkService.isOnline()) {
        <app-offline-warning mode="indicator" />
      }
    </div>
    <p>Here's what's happening</p>
  </section>

  <section class="create-group-card" aria-labelledby="create-group-heading">
    <div class="create-group-card__illustration" aria-hidden="true">
      <img src="/assets/images/logo.png" alt="" />
    </div>
    <div class="create-group-card__content">
      <h2 id="create-group-heading">Ready to split?</h2>
      <p>Create a group to start sharing expenses.</p>
      <ion-button expand="block" type="button" (click)="openCreateGroup()"
        >Create group</ion-button
      >
    </div>
  </section>

  <!-- Recent groups -->
  <app-recent-groups class="recent-gorups" />

  <!-- Recent activities -->
</ion-content>
