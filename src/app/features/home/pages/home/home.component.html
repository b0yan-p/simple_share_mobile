<ion-header class="ion-no-border">
  <ion-toolbar>
    <ion-title class="small">{{ firstName() ? 'Hi, ' + firstName() : 'Hi' }}</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <!-- Welcome -->
  <section class="home-greetings">
    <div class="bdd-flex bdd-ai-center bdd-jc-space-between">
      <h1>Good to see you!</h1>
      @if (!networkService.isOnline()) {
        <app-offline-warning mode="indicator" />
      }
    </div>
    <p>Here's what's happening</p>
  </section>

  <!-- Total net worth across all groups -->
  <section class="total-debt-card">
    <div class="">
      <p>You are owed</p>
      <p class="amount">$48.56</p>
      <p>across 3 groups</p>
    </div>
    <div>
      <img src="/assets/images/logo.png" alt="logo" />
      <div class="shadow"></div>
    </div>
  </section>

  <!-- Recent groups -->
  <app-recent-groups class="recent-gorups" />

  <!-- Recent activities -->
</ion-content>
